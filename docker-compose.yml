# Local/self-hosted stack: SQL Server 2022 + API + admin panel.
#   cp .env.example .env        # fill in the secrets (never commit .env)
#   ./sandbox/build-images.sh   # once, for code execution
#   docker compose up --build
# API: http://localhost:5080 · Admin: http://localhost:5173
name: devinterview

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports: ["1433:1433"]
    volumes: [sqldata:/var/opt/mssql]
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api:
    build: { context: ., dockerfile: backend/Dockerfile }
    depends_on:
      sqlserver: { condition: service_healthy }
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Default: Server=sqlserver,1433;Database=DevInterview;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Seed__AdminEmail: ${SEED_ADMIN_EMAIL:-}
      Seed__AdminPassword: ${SEED_ADMIN_PASSWORD:-}
      Https__Redirect: "false"
      Cors__AllowedOrigins__0: http://localhost:5173
      App__PublicBaseUrl: http://localhost:5080
      # Verification/reset codes are written to the API log; set Email__Provider=Smtp with Email__Host, Email__Username and Email__Password for real mail.
      Email__Provider: Log
      AI__Providers__Anthropic__ApiKey: ${ANTHROPIC_API_KEY:-}
      AI__Providers__OpenAI__ApiKey: ${OPENAI_API_KEY:-}
      AI__Providers__OpenAI__Model: ${OPENAI_MODEL:-}
      BackgroundJobs__Enabled: "true"
      CodeExecution__Provider: Docker
      # Same path on the host and in the container, because it is bind-mounted into each sandbox container.
      CodeExecution__WorkRoot: /var/lib/devinterview-sandbox
    ports: ["5080:8080"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # grants Docker access; see sandbox/README.md
      - /var/lib/devinterview-sandbox:/var/lib/devinterview-sandbox
      - uploads:/app/uploads

  admin:
    build:
      context: admin
      args: { VITE_API_BASE_URL: "http://localhost:5080" }
    depends_on: [api]
    ports: ["5173:80"]

volumes:
  sqldata:
  uploads:
